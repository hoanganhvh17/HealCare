<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        .container { font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #ddd; border-radius: 10px; }
        .header { background-color: #198754; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .footer { text-align: center; padding: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>HỒ SƠ ỨNG TUYỂN ĐÃ ĐƯỢC GHI NHẬN</h2></div>
    <div class="content">
        <p>Chào <strong><span th:text="${candidateName}"></span></strong>,</p>
        <p>Cảm ơn bạn đã ứng tuyển vị trí <strong><span th:text="${jobTitle}"></span></strong> tại MediTrust.</p>
        <p>Bộ phận Tuyển dụng sẽ xem xét hồ sơ của bạn và liên hệ lại trong vòng 3-5 ngày làm việc nếu bạn phù hợp với các tiêu chí của chúng tôi.</p>
        <p>Chúc bạn một ngày tốt lành!</p>
    </div>
    <div class="footer">MediTrust HR Team</div>
</div>
</body>
</html>
