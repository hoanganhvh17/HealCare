<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <th:block th:replace="~{admin/include/header :: pagehead (title=${pageTitle})}"></th:block>
</head>

<body class="admin-theme">
<th:block th:replace="~{admin/include/header :: header-nav}"></th:block>
<th:block th:replace="~{admin/include/sidebar :: sidebar}"></th:block>

<main id="main" class="main">

  <div class="pagetitle">
    <h1 th:text="${pageTitle}">Form User</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/manage-user}">Quản lý Người dùng</a></li>
        <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
      </ol>
    </nav>
  </div><section class="section">
  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Điền thông tin Người dùng</h5>

          <form th:action="@{/admin/manage-user/save}" th:object="${user}" method="post" class="row g-3">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
              Vui lòng sửa các lỗi dưới đây.
            </div>

            <input type="hidden" th:field="*{id}" />

            <div class="col-md-6">
              <label for="fullName" class="form-label">Họ tên</label>
              <input type="text" th:field="*{fullName}" class="form-control" id="fullName" required>
              <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="col-md-6">
              <label for="username" class="form-label">Username</label>
              <input type="text" th:field="*{username}" class="form-control" id="username" required>
              <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="col-12">
              <label for="email" class="form-label">Email</label>
              <input type="email" th:field="*{email}" class="form-control" id="email" required>
              <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="col-12">
              <label for="phone" class="form-label">Số điện thoại</label>
              <input type="tel" th:field="*{phone}" class="form-control" id="phone">
            </div>
            <div class="col-12">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" name="password" class="form-control" id="password"
                     placeholder="Để trống nếu không muốn thay đổi mật khẩu">
              <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="col-12">
              <label class="form-label">Vai trò</label>
              <div>
                <th:block th:each="role : ${allRoles}">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="roleIds"
                           th:value="${role.id}"
                           th:id="${'role' + role.id}"
                           th:attr="data-role=${role.name}"
                           th:checked="${user.roles != null && user.roles.contains(role)}">
                    <label class="form-check-label" th:for="${'role' + role.id}"
                           th:text="${role.name == 'ROLE_ADMIN' ? 'Admin' : (role.name == 'ROLE_DOCTOR' ? 'Bác sĩ' : (role.name == 'ROLE_HEAD_DOCTOR' ? 'Trưởng khoa' : (role.name == 'ROLE_RECEPTIONIST' ? 'Lễ tân' : 'Bệnh nhân')))}"></label>
                  </div>
                </th:block>
              </div>
            </div>

            <div class="col-12" id="headDeptWrapper">
              <label for="headDepartmentId" class="form-label">Khoa phụ trách (Trưởng khoa)</label>
              <select name="headDepartmentId" id="headDepartmentId" class="form-select">
                <option value="">-- Không phụ trách khoa nào --</option>
                <option th:each="dept : ${allDepartments}"
                        th:value="${dept.id}"
                        th:text="${dept.name}"
                        th:selected="${headDepartmentId != null && headDepartmentId == dept.id}"></option>
              </select>
              <small class="text-muted">
                Chỉ áp dụng khi tài khoản có vai trò <strong>Trưởng khoa</strong>. Đây là khoa mà người này
                được duyệt đơn nghỉ và lịch trực. Bỏ trống nếu chỉ là bác sĩ / nhân viên thường.
              </small>
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-primary">Lưu</button>
              <a th:href="@{/admin/manage-user}" class="btn btn-secondary">Hủy</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>

<!-- Chỉ hiện ô chọn khoa khi tài khoản được tick vai trò Trưởng khoa -->
<script>
  (function () {
    var headCb = document.querySelector('input[name="roleIds"][data-role="ROLE_HEAD_DOCTOR"]');
    var wrapper = document.getElementById('headDeptWrapper');
    if (!headCb || !wrapper) return;
    function sync() { wrapper.style.display = headCb.checked ? '' : 'none'; }
    headCb.addEventListener('change', sync);
    sync();
  })();
</script>

</main><th:block th:replace="~{admin/include/footer :: footer}"></th:block>
</body>
</html>
