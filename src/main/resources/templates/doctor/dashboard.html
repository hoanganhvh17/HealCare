<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{admin/include/header :: header (title='Bác sĩ Dashboard')}"></th:block>
    <style>
        .activity-item { position: relative; padding-bottom: 20px; border-left: 2px solid #eef0f2; padding-left: 20px; }
        .activity-item:last-child { padding-bottom: 0; }
        .activity-item::before { content: ""; position: absolute; left: -9px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #1977cc; }
        .review-avatar-small { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
        .schedule-row { padding: 12px 0; border-bottom: 1px dashed #e0e0e0; display: flex; align-items: center; justify-content: space-between; }
        .schedule-row:last-child { border-bottom: none; }
        .day-label { font-weight: 700; color: #4154f1; min-width: 80px; }
        .badge-shift { font-size: 0.75rem; padding: 5px 8px; border-radius: 4px; font-weight: 500; }

        /* Custom Chart Tooltip */
        .apexcharts-tooltip { background: #fff; border-color: #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<th:block th:replace="~{doctor/include/header :: header-nav}"></th:block>
<th:block th:replace="~{doctor/include/sidebar :: sidebar}"></th:block>

<main id="main" class="main">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="pagetitle mb-0">
            <h1>Tổng quan công việc</h1>
        </div>

        <form th:action="@{/doctor/dashboard}" method="get" class="d-flex align-items-center">
            <label class="me-2 small fw-bold text-muted">Thống kê:</label>
            <select name="range" class="form-select form-select-sm shadow-sm" onchange="this.form.submit()" style="width: 150px; border-radius: 20px;">
                <option value="7" th:selected="${currentRange == '7'}">7 ngày qua</option>
                <option value="30" th:selected="${currentRange == '30'}">30 ngày qua</option>
                <option value="all" th:selected="${currentRange == 'all'}">Toàn thời gian</option>
            </select>
        </form>
    </div>

    <section class="section dashboard">
        <div class="row">

            <div class="col-lg-8">
                <div class="row">

                    <div class="col-md-3">
                        <a th:href="@{/doctor/examinations(date=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')})}" class="text-decoration-none">
                            <div class="card info-card sales-card h-100 shadow-sm border-0">
                                <div class="card-body p-3">
                                    <h5 class="card-title small">Cần khám hôm nay</h5>
                                    <div class="d-flex align-items-center">
                                        <div class="card-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                            <i class="bi bi-people fs-5"></i>
                                        </div>
                                        <div class="ps-3">
                                            <h6 th:text="${countToday}" class="fs-5">0</h6>
                                            <span class="text-success small pt-1 fw-bold">bệnh nhân</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-3">
                        <a th:href="@{/doctor/booking-requests}" class="text-decoration-none">
                            <div class="card info-card revenue-card h-100 shadow-sm border-0">
                                <div class="card-body p-3">
                                    <h5 class="card-title small">Yêu cầu mới</h5>
                                    <div class="d-flex align-items-center">
                                        <div class="card-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                            <i class="bi bi-hourglass-split fs-5"></i>
                                        </div>
                                        <div class="ps-3">
                                            <h6 th:text="${countPending}" class="fs-5">0</h6>
                                            <span class="text-muted small pt-2 ps-1">chờ duyệt</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-3">
                        <div class="card info-card customers-card h-100 shadow-sm border-0">
                            <div class="card-body p-3">
                                <h5 class="card-title small">Đã hoàn thành</h5>
                                <div class="d-flex align-items-center">
                                    <div class="card-icon rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                        <i class="bi bi-check-circle fs-5"></i>
                                    </div>
                                    <div class="ps-3">
                                        <h6 th:text="${countCompleted}" class="fs-5">0</h6>
                                        <span class="text-muted small pt-2 ps-1">ca khám</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card info-card customers-card h-100 shadow-sm border-0">
                            <div class="card-body p-3">
                                <h5 class="card-title small">Đánh giá</h5>
                                <div class="d-flex align-items-center">
                                    <div class="card-icon rounded-circle d-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning" style="width: 45px; height: 45px;">
                                        <i class="bi bi-star-fill fs-5"></i>
                                    </div>
                                    <div class="ps-3">
                                        <h6 th:text="${avgRating}" class="fs-5">0.0</h6>
                                        <span class="text-muted small pt-2 ps-1">trung bình</span>
                                    </div>
                                </div>

                                <!-- THÊM ĐOẠN NÀY DÀNH CHO AI NHẮC NHỞ -->
                                <div class="mt-2 border-top pt-2">
                                    <div id="ai-review-advice" onclick="triggerAiReviewAnalysis()"
                                         class="text-muted"
                                         style="cursor: pointer; display: block; font-size: 0.75rem; line-height: 1.4; transition: all 0.3s ease;">
                                        <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true" style="width: 10px; height: 10px;"></span>
                                        <span class="fst-italic">Đang tải phân tích...</span>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mt-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body pb-0">
                                <h5 class="card-title">Tỷ lệ Trạng thái</h5>
                                <div id="doctorPieChart" style="min-height: 300px;"></div>
                                <script th:inline="javascript">
                                    document.addEventListener("DOMContentLoaded", () => {
                                        new ApexCharts(document.querySelector("#doctorPieChart"), {
                                            series: [
                                                /*[[${countPending}]]*/ 1,
                                                /*[[${countConfirmed}]]*/ 2,
                                                /*[[${countCompleted}]]*/ 3,
                                                /*[[${countCancelled}]]*/ 1
                                            ],
                                            chart: {
                                                height: 300,
                                                type: 'pie',
                                                toolbar: { show: false }
                                            },
                                            labels: ['Chờ duyệt', 'Đã xác nhận', 'Đã khám', 'Đã hủy'],
                                            colors: ['#ffc107', '#0d6efd', '#198754', '#dc3545'],
                                            legend: {
                                                position: 'bottom'
                                            },
                                            dataLabels: {
                                                enabled: true,
                                                formatter: function (val) {
                                                    return val.toFixed(1) + "%" // Hiển thị % với 1 số lẻ
                                                },
                                                style: {
                                                    fontSize: '12px',
                                                    colors: ['#fff']
                                                }
                                            },
                                            tooltip: {
                                                y: {
                                                    formatter: function(val) {
                                                        return val + " ca" // Tooltip hiện số lượng
                                                    }
                                                }
                                            }
                                        }).render();
                                    });
                                </script>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mt-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body pb-0">
                                <h5 class="card-title">Phân bố Đánh giá</h5>
                                <div id="ratingBarChart" style="min-height: 300px;"></div>
                                <script th:inline="javascript">
                                    document.addEventListener("DOMContentLoaded", () => {
                                        new ApexCharts(document.querySelector("#ratingBarChart"), {
                                            series: [{
                                                name: 'Lượt đánh giá',
                                                data: [[${ratingDist}]] // [5 sao, 4 sao...]
                                            }],
                                            chart: {
                                                type: 'bar',
                                                height: 300,
                                                toolbar: { show: false }
                                            },
                                            plotOptions: {
                                                bar: {
                                                    borderRadius: 4,
                                                    horizontal: true,
                                                    barHeight: '50%',
                                                    distributed: true // Màu sắc khác nhau cho từng cột
                                                }
                                            },
                                            dataLabels: { enabled: true },
                                            xaxis: {
                                                categories: ['5 Sao', '4 Sao', '3 Sao', '2 Sao', '1 Sao'],
                                            },
                                            colors: ['#198754', '#20c997', '#ffc107', '#fd7e14', '#dc3545'], // Xanh -> Đỏ
                                            legend: { show: false },
                                            grid: { show: false }
                                        }).render();
                                    });
                                </script>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-lg-4">

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Phản hồi mới nhất</h5>
                        <div class="activity">
                            <div th:each="rv : ${recentReviews}" class="activity-item d-flex">
                                <div class="activite-label me-3">
                                    <img th:if="${rv.booking.user.avatar != null}" th:src="@{'/uploads/' + ${rv.booking.user.avatar}}" class="review-avatar-small">
                                    <img th:if="${rv.booking.user.avatar == null}" th:src="@{/assets/img/default-avatar.png}" class="review-avatar-small">
                                </div>
                                <div class="activity-content">
                                    <strong th:text="${rv.booking.user.fullName}">Tên BN</strong>
                                    <div class="text-warning small mb-1">
                                        <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, rv.rating)}"></i>
                                    </div>
                                    <p class="small text-muted mb-0" th:text="${#strings.abbreviate(rv.comment, 50)}">...</p>
                                    <small class="text-muted" style="font-size: 10px;" th:text="${#temporals.format(rv.createdAt, 'dd/MM HH:mm')}"></small>
                                </div>
                            </div>
                            <div th:if="${recentReviews.isEmpty()}" class="text-center text-muted small py-2">Chưa có đánh giá nào.</div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title">Lịch trực trong tuần</h5>
                        <div th:if="${weeklyScheduleMap.isEmpty()}" class="text-muted small text-center">Chưa đăng ký lịch trực.</div>

                        <div th:unless="${weeklyScheduleMap.isEmpty()}">
                            <div th:each="entry : ${weeklyScheduleMap}" class="schedule-row">
                                <div class="day-label">
                                    <i class="bi bi-calendar-event me-1"></i> <span th:text="${entry.key}">Thứ 2</span>
                                </div>
                                <div class="shift-badges">
                                    <span th:each="s : ${entry.value}"
                                          class="badge badge-shift"
                                          th:classappend="${s.startTime.toString() == '07:30' ? 'bg-primary' : (s.startTime.toString() == '13:30' ? 'bg-warning text-dark' : 'bg-dark')}">
                                        <span th:text="${s.startTime} + ' - ' + ${s.endTime}"></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <a th:href="@{/doctor/schedule-register}" class="btn btn-light btn-sm rounded-pill w-100 border text-muted">
                                <i class="bi bi-gear"></i> Cấu hình lịch
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{doctor/include/footer :: footer}"></th:block>

<script th:src="@{/assets-admin/vendor/apexcharts/apexcharts.min.js}"></script>
<script th:src="@{/assets-admin/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets-admin/js/main.js}"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        // 1. Gọi API lấy lời nhắc nhở nhanh dựa trên số sao khi trang vừa tải xong
        fetch('/api/doctor/chat/quick-review-advice')
            .then(response => response.json())
            .then(data => {
                const adviceDiv = document.getElementById('ai-review-advice');
                if (adviceDiv) {
                    adviceDiv.innerHTML = `
                        <i class="bi bi-robot me-1"></i>
                        <span class="${data.colorClass}">${data.advice}</span>
                        <br>
                        <small class="text-primary text-decoration-underline" style="font-size: 11px;">
                            Bấm để AI phân tích chi tiết
                        </small>`;
                }
            })
            .catch(error => {
                const adviceDiv = document.getElementById('ai-review-advice');
                if (adviceDiv) adviceDiv.innerHTML = "Không thể tải gợi ý từ trợ lý.";
            });
    });

    // 2. Hàm xử lý sự kiện click vào ô Đánh giá để kích hoạt Trợ lý ảo phân tích sâu
    function triggerAiReviewAnalysis() {
        const chatBox = document.getElementById('ai-chat-box-doctor');
        const chatInput = document.getElementById('ai-chat-input-doctor');
        const sendBtn = document.getElementById('ai-chat-send-doctor');

        // Kiểm tra an toàn xem các thành phần chatbot đã được load lên DOM chưa
        if (!chatBox || !chatInput || !sendBtn) {
            console.error("Lỗi UX: Hệ thống chưa tìm thấy các ID thành phần của Trợ lý Bác sĩ.");
            return;
        }

        // Nếu khung chat chưa mở (không có class 'open' theo logic JS mới)
        if (!chatBox.classList.contains('open')) {
            // Sử dụng hàm global đã định nghĩa ở file ai-chat-doctor.js
            if (typeof window.toggleDoctorAI === 'function') {
                window.toggleDoctorAI();
            } else {
                // Fallback đề phòng
                const toggleBtn = document.getElementById('ai-chat-toggle-doctor');
                if (toggleBtn) toggleBtn.click();
            }
        }

        // Trễ 350ms đợi khung chat thực hiện xong hiệu ứng mở
        setTimeout(() => {
            const promptText = "Hãy phân tích các đánh giá bằng chữ gần đây của bệnh nhân và chỉ ra điểm tôi làm tốt, điểm cần cải thiện.";

            // Tận dụng luôn hàm sendQuickReplyDoctor đã viết sẵn ở file tổng hợp
            if (typeof window.sendQuickReplyDoctor === 'function') {
                window.sendQuickReplyDoctor(promptText, null);
            } else {
                // Logic cũ nếu hàm trên chưa kịp load
                chatInput.value = promptText;
                chatInput.dispatchEvent(new Event('input', { bubbles: true }));
                chatInput.focus();
                sendBtn.click();
            }
        }, 350);
    }
</script>
</body>
</html>
