<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="header(title)">
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title th:text="${title} ?: 'Dashboard - BookingHealthy'">Dashboard</title>
  <link th:href="@{/assets-admin/img/favicon.png}" rel="icon">
  <link th:href="@{/assets-admin/img/apple-touch-icon.png}" rel="apple-touch-icon">
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/quill/quill.snow.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/quill/quill.bubble.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/remixicon/remixicon.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/vendor/simple-datatables/style.css}" rel="stylesheet">
  <link th:href="@{/assets-admin/css/style.css}" rel="stylesheet">
</head>

<body>

<header th:fragment="header-nav" id="header" class="header fixed-top d-flex align-items-center">

  <div class="d-flex align-items-center justify-content-between">
    <a th:href="@{/admin/dashboard}" class="logo d-flex align-items-center">
      <img th:src="@{/assets-admin/img/logo.png}" alt="">
      <span class="d-none d-lg-block">BookingHealthy</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div>

  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">

      <!-- NÚT MỞ AI SIDEBAR (Lệnh cực mạnh) -->
      <li class="nav-item pe-3">
        <button type="button" class="nav-link nav-icon" onclick="window.toggleDoctorAI();" style="border:none; background:none; cursor:pointer;">
          <i class="bi bi-stars" style="color: #198754; font-size: 1.4rem;"></i>
        </button>
      </li>

      <!-- CHUÔNG THÔNG BÁO (nhân viên).
           Đặt ở fragment header dùng chung nên có mặt trên MỌI trang bác sĩ / trưởng khoa /
           lễ tân — trước đây chuông chỉ nằm ở trang Lịch làm việc, nên bác sĩ không biết
           đơn của mình đã được duyệt hay chưa.
           Dựng bằng class Bootstrap thuần: work-schedule.css không được nạp ở phần lớn
           các trang này. Fragment cũng được trang bệnh nhân dùng, nên chặn theo vai trò. -->
      <li class="nav-item dropdown pe-3"
          sec:authorize="hasAnyRole('DOCTOR','HEAD_DOCTOR','RECEPTIONIST')">
        <a class="nav-link nav-icon position-relative" href="#" id="staffNotifToggle"
           data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Thông báo">
          <i class="bi bi-bell" style="font-size: 1.3rem;"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                id="staffNotifBadge">0</span>
        </a>

        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow p-3"
             style="width: 340px; max-height: 420px; overflow-y: auto;">
          <h6 class="fw-bold mb-2">Thông báo</h6>
          <div id="staffNotifList">
            <div class="text-muted small py-2">Đang tải…</div>
          </div>
        </div>
      </li>

      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
          <img th:src="${#authentication.principal.avatar != null && !#strings.isEmpty(#authentication.principal.avatar)}
                                     ? @{'/uploads/' + ${#authentication.principal.avatar}}
                                     : @{/assets-admin/img/profile-img.jpg}"
               alt="Profile" class="rounded-circle">
          <span class="d-none d-md-block dropdown-toggle ps-2"
                th:text="${#authentication.principal.fullName}">Admin</span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <li class="dropdown-header">
            <h6 th:text="${#authentication.principal.fullName}">Tên Admin</h6>
            <span>Quản trị viên</span>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item d-flex align-items-center" th:href="@{/user/profile}"><i class="bi bi-person"></i> <span>Hồ sơ</span></a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item d-flex align-items-center" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> <span>Đăng xuất</span></a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- NHÚNG SIDEBAR TRỰC TIẾP VÀO HEADER ĐỂ CHẮC CHẮN NÓ LUÔN TỒN TẠI -->
  <div th:replace="~{doctor/include/ai-chat-doctor :: chat-widget}"></div>

  <!-- Script đi kèm markup chuông ở trên: nạp ngay trong fragment để mọi trang dùng
       header này đều có chuông chạy, không phải sửa 13 template. Script tự thoát khi
       trang không có chuông. -->
  <script th:src="@{/assets/js/staff-notifications.js}"></script>
</header>

</body>
</html>
