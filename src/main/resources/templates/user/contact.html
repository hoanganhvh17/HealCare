<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Liên hệ - MediTrust</title>
  <link th:href="@{/assets/img/favicon.png}" rel="icon">
  <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/aos/aos.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/swiper/swiper-bundle.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/glightbox/css/glightbox.min.css}" rel="stylesheet">
  <link th:href="@{/assets/css/main.css}" rel="stylesheet">
</head>

<body class="contact-page">

<div th:replace="~{user/include/header :: header-nav}"></div>

<main class="main">

  <div class="page-title">
    <div class="breadcrumbs">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/}"><i class="bi bi-house"></i> Trang chủ</a></li>
          <li class="breadcrumb-item active current">Liên hệ</li>
        </ol>
      </nav>
    </div>
    <div class="title-wrapper">
      <h1>Liên hệ</h1>
    </div>
  </div>

  <section id="contact" class="contact section">
    <div class="container">
      <div class="contact-wrapper">
        <div class="contact-info-panel">
          <div class="contact-info-header"><h3>Thông tin liên hệ</h3></div>
          <div class="contact-info-cards">
            <div class="info-card"><div class="icon-container"><i class="bi bi-pin-map-fill"></i></div><div class="card-content"><h4>Địa chỉ</h4><p>Số 888 Tây Mỗ, Nam Từ Liêm, Hà Nội</p></div></div>
            <div class="info-card"><div class="icon-container"><i class="bi bi-telephone-fill"></i></div><div class="card-content"><h4>Hotline</h4><p>0985 123 888</p></div></div>
          </div>
        </div>

        <div class="contact-form-panel">
          <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.4736632131003!2d105.7325318759702!3d21.05373598691888!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31345457e292d5bf%3A0x20ac91c94d74439a!2zVHLGsOG7nW5nIMSQ4bqhaSBo4buNYyBDw7RuZyBuZ2hp4buHcCBIw6AgTuG7mWk!5e0!3m2!1svi!2s!4v1763539525191!5m2!1svi!2s" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>

          <div class="form-container">
            <h3>Gửi lời nhắn</h3>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
              <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
              <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/contact}" method="post">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nameInput" name="name" placeholder="Full Name" required>
                <label for="nameInput">Họ và tên</label>
              </div>

              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="emailInput" name="email" placeholder="Email Address" required>
                <label for="emailInput">Email</label>
              </div>

              <div class="form-floating mb-3">
                <textarea class="form-control" id="messageInput" name="message" rows="5" placeholder="Your Message" style="height: 150px" required></textarea>
                <label for="messageInput">Nội dung tin nhắn</label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn-submit">Gửi tin nhắn <i class="bi bi-send-fill ms-2"></i></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="footer" class="footer position-relative light-background">
  <div class="container copyright text-center mt-4"><p>© <span>Copyright</span> <strong class="px-1 sitename">MediTrust</strong> <span>All Rights Reserved</span></p></div>
</footer>
<div th:replace="~{user/include/ai-chat :: chat-widget}"></div>

<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/vendor/aos/aos.js}"></script>
<script th:src="@{/assets/vendor/purecounter/purecounter_vanilla.js}"></script>
<script th:src="@{/assets/vendor/swiper/swiper-bundle.min.js}"></script>
<script th:src="@{/assets/vendor/glightbox/js/glightbox.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>

</body>
</html>
