<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Đội ngũ Bác sĩ - HealCare</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
  <link th:href="@{/assets/css/main.css}" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8fafc;
      color: #334155;
    }

    /* Common Colors & Utilities */
    .text-teal { color: #0d7b6a !important; }
    .bg-teal { background-color: #0d7b6a !important; }

    .btn-teal {
      background-color: #0d7b6a;
      color: white;
      border-radius: 8px;
      font-weight: 500;
      padding: 0.6rem 1.25rem;
      border: none;
      width: 100%;
      transition: all 0.3s;
      cursor: pointer;
    }
    .btn-teal:hover { background-color: #0a5f52; color: white; }

    .btn-light-blue {
      background-color: #dbeafe;
      color: #1e40af;
      border-radius: 8px;
      font-weight: 500;
      padding: 0.6rem 1.25rem;
      border: none;
      width: 100%;
      transition: all 0.3s;
    }
    .btn-light-blue:hover { background-color: #bfdbfe; }

    /* Filter Sidebar */
    .filter-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
    }
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }
    .filter-group { margin-bottom: 1.5rem; }
    .filter-label {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: #334155;
      display: block;
    }
    .form-select {
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      color: #475569;
      padding: 0.6rem 2.25rem 0.6rem 1rem;
      box-shadow: none;
    }

    /* Interactive Stars CSS */
    .interactive-stars {
      display: flex;
      gap: 6px;
      font-size: 1.8rem;
      cursor: pointer;
      color: #cbd5e1; /* Màu xám mặc định */
    }
    .interactive-stars i {
      transition: color 0.2s;
    }
    .interactive-stars i.active {
      color: #f59e0b; /* Màu vàng khi được chọn */
    }

    /* Doctor Card */
    .doctor-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
    }
    .doctor-card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .doctor-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .doctor-info-wrap { display: flex; gap: 1rem; }
    .doctor-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background-color: #f1f5f9; }
    .doctor-name { font-size: 1.15rem; font-weight: 700; margin: 0 0 0.2rem 0; color: #1e293b; display: flex; align-items: center; gap: 0.4rem; }
    .verified-icon { color: #10b981; font-size: 1.1rem; }
    .doctor-spec { color: #0d7b6a; font-size: 0.9rem; font-weight: 500; }
    .rating-badge { background: #d1fae5; color: #065f46; padding: 0.3rem 0.6rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem; }
    .doctor-desc { color: #475569; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; }

    .schedule-section { border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: auto; margin-bottom: 1.5rem; }
    .schedule-title { font-size: 0.85rem; color: #64748b; margin-bottom: 0.8rem; }
    .time-slots { display: flex; gap: 0.5rem; flex-wrap: wrap; min-height: 32px; }
    .time-slot { border: 1px solid #cbd5e1; border-radius: 8px; padding: 0.4rem 0.8rem; text-align: center; font-size: 0.85rem; background: #f8fafc; color: #1e293b; min-width: 80px; }
  </style>
</head>

<body>

<div th:replace="~{user/include/header :: header-nav}"></div>

<main class="main container" style="padding-top: 130px; padding-bottom: 4rem;">

  <div class="page-header-text mb-5">
    <h1 style="font-size: 2.2rem; font-weight: 700; color: #1e293b;">Đội ngũ Bác sĩ</h1>
    <p style="color: #64748b; font-size: 1.05rem;">Tìm kiếm và đặt lịch hẹn với các chuyên gia y tế hàng đầu của chúng tôi.</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-3">
      <div class="filter-card sticky-lg-top" style="top: 100px; z-index: 1;">
        <div class="filter-header">
          <span>Bộ lọc</span>
          <i class="bi bi-funnel"></i>
        </div>

        <div class="filter-group">
          <label class="filter-label">Tìm kiếm theo tên</label>
          <div style="position: relative;">
            <input type="text" id="searchDoctorName" class="form-control" placeholder="Nhập tên bác sĩ..." style="border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.6rem 1rem; font-size: 0.95rem;">
            <i class="bi bi-search" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none;"></i>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Chuyên khoa</label>
          <select class="form-select" id="departmentFilter">
            <option value="" th:selected="${currentDepartmentId == null}">Tất cả chuyên khoa</option>
            <option th:each="dept : ${departments}"
                    th:value="${dept.id}"
                    th:text="${dept.name}"
                    th:selected="${dept.id == currentDepartmentId}">Tên khoa</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Đánh giá tối thiểu</label>
          <div class="interactive-stars" id="starFilter">
            <i class="bi bi-star-fill" data-value="1"></i>
            <i class="bi bi-star-fill" data-value="2"></i>
            <i class="bi bi-star-fill" data-value="3"></i>
            <i class="bi bi-star-fill" data-value="4"></i>
            <i class="bi bi-star-fill" data-value="5"></i>
          </div>
          <small class="text-muted mt-1 d-block" id="starFilterText">Hiển thị tất cả</small>
        </div>

        <div class="filter-group">
          <label class="filter-label">Thời gian trống</label>
          <select class="form-select" id="timeFilter">
            <option value="today" selected>Hôm nay</option>
            <option value="tomorrow">Ngày mai</option>
          </select>
        </div>

        <button class="btn btn-light-blue w-100" id="clearFilterBtn">Xóa bộ lọc</button>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="row g-4" id="doctorListContainer">
      </div>
    </div>
  </div>

</main>

<div th:replace="~{user/include/footer :: footer}"></div>
<div th:replace="~{user/include/ai-chat :: chat-widget}"></div>

<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}" defer></script>

<script th:inline="javascript">
  function removeVietnameseTones(str) {
    if (!str) return "";
    return str.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D');
  }

  document.addEventListener("DOMContentLoaded", function () {
    const departmentFilter = document.getElementById("departmentFilter");
    const timeFilter = document.getElementById("timeFilter");
    const doctorListContainer = document.getElementById("doctorListContainer");
    const clearFilterBtn = document.getElementById("clearFilterBtn");
    const starFilterIcons = document.querySelectorAll("#starFilter i");
    const starFilterText = document.getElementById("starFilterText");
    const searchInput = document.getElementById("searchDoctorName");

    let allFetchedDoctors = []; // Lưu trữ danh sách bác sĩ lấy từ API
    let currentMinRating = 0;   // 0 nghĩa là không lọc theo sao
    let currentSearchQuery = ""; // Lưu giá trị tìm kiếm

    // --- LOGIC XỬ LÝ CHỌN SAO ---
    starFilterIcons.forEach(star => {
      // Hiệu ứng hover
      star.addEventListener("mouseover", function() {
        const val = parseInt(this.getAttribute("data-value"));
        starFilterIcons.forEach(s => {
          if (parseInt(s.getAttribute("data-value")) <= val) {
            s.style.color = "#f59e0b"; // Vàng
          } else {
            s.style.color = "#cbd5e1"; // Xám
          }
        });
      });

      // Trả lại màu theo giá trị đã chọn khi di chuột ra ngoài
      star.parentElement.addEventListener("mouseout", function() {
        updateStarUI();
      });

      // Xử lý khi click chọn sao
      star.addEventListener("click", function() {
        currentMinRating = parseInt(this.getAttribute("data-value"));
        starFilterText.textContent = `Từ ${currentMinRating} sao trở lên`;
        updateStarUI();

        // Gọi lại hàm render để lọc dữ liệu
        renderDoctorCards();
      });
    });

    function updateStarUI() {
      starFilterIcons.forEach(s => {
        if (parseInt(s.getAttribute("data-value")) <= currentMinRating) {
          s.classList.add("active");
          s.style.color = "#f59e0b";
        } else {
          s.classList.remove("active");
          s.style.color = "#cbd5e1";
        }
      });
    }

    // --- HÀM GỌI API LẤY DANH SÁCH BÁC SĨ ---
    function fetchDoctorsByDepartment(departmentId) {
      const apiUrl = departmentId ? `/api/doctors?departmentId=${departmentId}` : `/api/doctors`;

      doctorListContainer.innerHTML = `
        <div class="col-12 text-center text-muted">
          <div class="spinner-border text-teal" role="status"></div>
          <p class="mt-2">Đang tải danh sách bác sĩ...</p>
        </div>`;

      fetch(apiUrl)
              .then(response => {
                if (!response.ok) throw new Error("Không thể tải dữ liệu từ API");
                return response.json();
              })
              .then(doctors => {
                allFetchedDoctors = doctors; // Lưu lại để dùng cho bộ lọc Sao
                renderDoctorCards();
              })
              .catch(error => {
                console.error("Error fetching doctors:", error);
                doctorListContainer.innerHTML = `
            <div class="col-12 text-center text-danger">
              <p><i class="bi bi-exclamation-triangle me-1"></i> Lỗi tải dữ liệu.</p>
            </div>`;
              });
    }

    // --- HÀM RENDER & LỌC SAO & TÌM KIẾM ---
    function renderDoctorCards() {
      doctorListContainer.innerHTML = "";

      // 1. Lọc danh sách bác sĩ theo Rating
      let filteredDoctors = allFetchedDoctors.filter(doc => {
        const docRating = doc.rating || 5.0; // Nếu null mặc định là 5
        return docRating >= currentMinRating;
      });

      // 2. Lọc theo tên bác sĩ (không phân biệt hoa/thường)
      if (currentSearchQuery.trim().length > 0) {
        const query = removeVietnameseTones(currentSearchQuery.toLowerCase());
        filteredDoctors = filteredDoctors.filter(doc => {
          const fullName = removeVietnameseTones((doc.fullName || "").toLowerCase());
          
          // Chỉ tìm kiếm trong tên bác sĩ
          return fullName.includes(query);
        });
      }

      if (filteredDoctors.length === 0) {
        doctorListContainer.innerHTML = `
          <div class="col-12 text-center text-muted">
            <p><i class="bi bi-search me-1"></i> Không tìm thấy bác sĩ nào phù hợp tiêu chí.</p>
          </div>`;
        return;
      }

      // 3. In thẻ HTML
      filteredDoctors.forEach(doctor => {
        const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(doctor.price);
        const ratingDisplay = doctor.rating ? doctor.rating.toFixed(1) : '5.0';

          const cardHtml = `
          <div class="col-md-6 doctor-card-wrapper" id="doc-wrapper-${doctor.id}">
            <div class="doctor-card">
              <div class="doctor-header">
                <div class="doctor-info-wrap">

                  <a href="/doctors/${doctor.id}">
                    <img src="${doctor.avatar}" alt="${doctor.fullName}" class="doctor-avatar">
                  </a>

                  <div>
                    <h3 class="doctor-name">
                      <a href="/doctors/${doctor.id}" style="color: #1e293b; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#0d7b6a'" onmouseout="this.style.color='#1e293b'">
                        ${doctor.degree ? doctor.degree : 'BS.'} ${doctor.fullName}
                      </a>
                      <i class="bi bi-patch-check verified-icon"></i>
                    </h3>
                    <p class="doctor-spec">${doctor.departmentName}</p>
                  </div>

                </div>
                <div class="rating-badge">
                  <i class="bi bi-star-fill"></i> ${ratingDisplay}
                </div>
              </div>

              <div class="doctor-desc">
                <p class="mb-1"><i class="bi bi-briefcase text-muted me-2"></i>Kinh nghiệm: <strong>${doctor.experienceYears} năm</strong></p>
                <p class="mb-0 text-teal"><i class="bi bi-cash-coin me-2"></i>Giá khám: <strong>${formattedPrice}</strong></p>
              </div>

              <div class="schedule-section">
                <p class="schedule-title">Lịch trống <span class="fw-bold target-date-label"></span>:</p>
                <div class="time-slots" data-doctor-id="${doctor.id}">
                  <span class="text-muted small w-100"><i class="spinner-border spinner-border-sm me-1 text-teal"></i> Đang tải lịch...</span>
                </div>
              </div>

              <button class="btn-teal" onclick="location.href='/appointment?doctorId=${doctor.id}'">Đặt lịch ngay</button>
            </div>
          </div>
        `;
        doctorListContainer.insertAdjacentHTML('beforeend', cardHtml);
      });

      // 4. Chạy hàm kiểm tra lịch trống cho các bác sĩ vừa render
      loadAllSchedules();
    }

    // --- HÀM TÍNH LỊCH TRỐNG (LỌC THEO THỜI GIAN) ---
    async function loadAllSchedules() {
      // Chỉ giờ hành chính — ngoài giờ là phiên trực, không nhận đặt khám
      const allTimeSlots = [
        "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00",
        "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00"
      ];

      // Xác định ngày cần kiểm tra dựa vào Dropdown Thời gian
      let targetDate = new Date();
      let isCheckingToday = true;
      let dateLabel = "(Hôm nay)";

      if (timeFilter.value === "tomorrow") {
        targetDate.setDate(targetDate.getDate() + 1);
        isCheckingToday = false;
        dateLabel = "(Ngày mai)";
      }

      const currentDateStr = targetDate.getFullYear() + '-' + String(targetDate.getMonth() + 1).padStart(2, '0') + '-' + String(targetDate.getDate()).padStart(2, '0');
      const currentHour = new Date().getHours();     // Luôn lấy giờ thực tế hiện tại
      const currentMinute = new Date().getMinutes();

      const timeSlotContainers = document.querySelectorAll('.time-slots[data-doctor-id]');

      timeSlotContainers.forEach(async (container) => {
        const doctorId = container.getAttribute('data-doctor-id');
        const wrapper = document.getElementById(`doc-wrapper-${doctorId}`);

        // Cập nhật nhãn thời gian trên giao diện
        wrapper.querySelector('.target-date-label').textContent = dateLabel;

        try {
          const res = await fetch(`/api/bookings/booked-slots?doctorId=${doctorId}&date=${currentDateStr}`);
          let bookedTimes = [];
          if (res.ok) bookedTimes = await res.json();

          let availableSlots = [];
          for (let slot of allTimeSlots) {
            const [slotHourStr, slotMinuteStr] = slot.split(':');
            const slotHour = parseInt(slotHourStr);
            const slotMinute = parseInt(slotMinuteStr);

            let isPast = false;
            // Chỉ chặn giờ quá khứ nếu đang xem lịch của "Hôm nay"
            if (isCheckingToday) {
              if (slotHour < currentHour || (slotHour === currentHour && slotMinute <= currentMinute)) {
                isPast = true;
              }
            }

            const isBooked = bookedTimes.some(booked => booked.split(' - ')[0] === slot);
            if (!isPast && !isBooked) {
              availableSlots.push(slot);
            }
          }

          // Bác sĩ LUÔN hiển thị trong danh sách. Nếu ngày đang xem hết chỗ thì báo rõ,
          // để khách vẫn thấy bác sĩ và bấm "Đặt lịch ngay" chọn ngày khác — không ẩn thẻ.
          container.innerHTML = '';
          wrapper.style.display = 'block';

          if (availableSlots.length > 0) {
            const slotsToShow = availableSlots.slice(0, 3);
            slotsToShow.forEach(slot => {
              const span = document.createElement('span');
              span.className = 'time-slot';
              span.textContent = slot;
              container.appendChild(span);
            });

            if (availableSlots.length > 3) {
              const extraSpan = document.createElement('span');
              extraSpan.className = 'time-slot';
              extraSpan.style = 'background: none; color: #64748b; font-weight: bold; border: 1px solid #cbd5e1;';
              extraSpan.textContent = '+' + (availableSlots.length - 3);
              container.appendChild(extraSpan);
            }
          } else {
            container.innerHTML = '<span class="text-muted small"><i class="bi bi-calendar-x me-1"></i>Hết lịch trống, hãy chọn ngày khác</span>';
          }

        } catch (err) {
          container.innerHTML = '<span class="text-muted small">Không tải được lịch</span>';
        }
      });
    }

    // --- LẮNG NGHE SỰ KIỆN FILTER ---
    departmentFilter.addEventListener("change", function () {
      fetchDoctorsByDepartment(this.value);
    });

    timeFilter.addEventListener("change", function () {
      // Khi đổi ngày, chỉ cần chạy lại hàm tính lịch, không cần gọi lại API bác sĩ
      renderDoctorCards();
    });

    // --- LẮNG NGHE SỰ KIỆN TÌM KIẾM (REAL-TIME) ---
    searchInput.addEventListener("input", function () {
      currentSearchQuery = this.value;
      renderDoctorCards(); // Render lại danh sách ngay khi người dùng gõ
    });

    clearFilterBtn.addEventListener("click", function () {
      departmentFilter.value = "";
      timeFilter.value = "today";
      searchInput.value = "";

      currentMinRating = 0;
      currentSearchQuery = "";
      starFilterText.textContent = "Hiển thị tất cả";
      updateStarUI();

      fetchDoctorsByDepartment("");
    });

    // --- KHỞI CHẠY ---
    fetchDoctorsByDepartment(departmentFilter.value);
  });
</script>
</body>
</html>
