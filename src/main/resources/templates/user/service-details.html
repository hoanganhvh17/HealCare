<div th:replace="~{user/include/header :: header-nav}"></div>

<main class="main">

  <div class="page-title">
    <div class="breadcrumbs">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/}"><i class="bi bi-house"></i> Trang chủ</a></li>
          <li class="breadcrumb-item"><a th:href="@{/services}">Dịch vụ</a></li>
          <li class="breadcrumb-item active current" th:text="${service.name}">Chi tiết Dịch vụ</li>
        </ol>
      </nav>
    </div>
    <div class="title-wrapper">
      <h1 th:text="${service.name}">Tên Dịch vụ</h1>
    </div>
  </div>

  <section id="service-details-2" class="service-details-2 section">
    <div class="container" data-aos="fade-up" data-aos-delay="100">
      <div class="row gy-5">

        <div class="col-lg-6" data-aos="zoom-in" data-aos-delay="200">
          <div class="service-image">
            <img th:if="${service.image != null}" th:src="@{'/assets/img/health/' + ${service.image}}"
                 onerror="this.src='/assets/img/health/cardiology-3.webp'"
                 alt="Service Image" class="img-fluid rounded">
            <img th:if="${service.image == null}" th:src="@{/assets/img/health/cardiology-3.webp}"
                 alt="Default Image" class="img-fluid rounded">

            <div class="service-tag">
              <span th:text="${service.category}">Specialized Care</span>
            </div>
          </div>
        </div>

        <div class="col-lg-6" data-aos="fade-left" data-aos-delay="300">
          <div class="service-content">
            <h2 th:text="${service.name}">Tên Dịch vụ</h2>

            <div class="alert alert-primary mt-3 mb-4">
              <i class="bi bi-tag-fill me-2"></i>
              <strong>Chi phí tham khảo: </strong>
              <span th:text="${service.price}">Giá</span>
            </div>

            <p class="text-muted mb-4" th:text="${service.description}">
              Mô tả chi tiết dịch vụ...
            </p>

            <div class="service-actions">
              <a th:href="@{/appointment}" class="btn btn-primary btn-lg">
                <i class="bi bi-calendar-check me-2"></i>Đặt lịch hẹn ngay
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>
