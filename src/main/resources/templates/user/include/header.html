<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header-nav" id="header" class="header d-flex align-items-center fixed-top bg-white shadow-sm py-2">
    <input type="hidden" id="current-user-id" th:value="${#authorization.expression('isAuthenticated()') ? #authentication.name : 'guest'}" />

    <div class="header-container container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

        <!-- Logo -->
        <a th:href="@{/}" class="logo d-flex align-items-center me-auto me-xl-0 text-decoration-none">
            <h1 class="sitename m-0 fw-bold" style="color: #00796b;">HealCare</h1>
        </a>

        <!-- Navigation Menu -->
        <nav id="navmenu" class="navmenu mx-auto">
            <!-- d-xl-flex chứ KHÔNG phải d-flex: Bootstrap sinh `.d-flex{display:flex!important}`,
                 mà theme ẩn menu trên mobile bằng `.navmenu ul{display:none}` (main.css:387) —
                 !important thắng, nên menu luôn bung thành panel absolute đè kín màn hình và nút
                 hamburger vô nghĩa trên cả 22 trang. d-xl-flex chỉ áp dụng từ 1200px, khớp đúng
                 ngưỡng max-width:1199px của theme, nên dưới ngưỡng đó theme lại tự lo được. -->
            <ul class="d-xl-flex list-unstyled m-0 gap-4 align-items-center">
                <li>
                    <a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Trang chủ</a>
                </li>
                <li>
                    <a th:href="@{/departments}" th:classappend="${activePage == 'departments'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Chuyên khoa</a>
                </li>
                <li>
                    <a th:href="@{/services}" th:classappend="${activePage == 'services'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Dịch vụ</a>
                </li>
                <li>
                    <a th:href="@{/doctors}" th:classappend="${activePage == 'doctors'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Đội ngũ bác sĩ</a>
                </li>
                <li>
                    <a th:href="@{/news}" th:classappend="${activePage == 'news'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Tin tức</a>
                </li>
                <li>
                    <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? 'active'" class="text-decoration-none fw-medium nav-link-custom">Giới thiệu</a>
                </li>
            </ul>
            <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>

        <!-- Right Side Actions.
             class="header-actions" là chỗ bám cho responsive.css thu gọn nhóm nút này trên
             màn hẹp — bám theo `.d-flex.align-items-center.gap-4` thì chỉ cần ai đó đổi gap
             là luật CSS chết lặng. -->
        <div class="header-actions d-flex align-items-center gap-4">

            <!-- Nút Đặt lịch khám -->
            <a class="btn fw-bold px-4 py-2 rounded-pill shadow-sm" style="background-color: #00796b; color: white;" th:href="@{/appointment}">
                Đặt lịch khám
            </a>

            <div class="d-flex align-items-center gap-3">
                <!-- CHUÔNG THÔNG BÁO (bệnh nhân).
                     Chỉ render khi đã đăng nhập: khách vãng lai không có thông báo nào, hiện
                     chuông chỉ tạo ra một cú bấm hụt. Trước đây đây là thẻ <a href="#"> chết —
                     không dropdown, không badge, không script — nên các thông báo mà hệ thống
                     ĐÃ ghi cho bệnh nhân (nhắc tái khám) không có đường nào tới được họ.
                     Id để userNotif* chứ không staffNotif*: medical-record-detail.html nhúng
                     cả header này lẫn khu quản trị, hai chuông phải sống chung được. -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <a href="#" class="text-dark fs-5 position-relative" id="userNotifToggle"
                       data-bs-toggle="dropdown" data-bs-auto-close="outside"
                       aria-expanded="false" title="Thông báo" style="color: #00796b !important;">
                        <i class="bi bi-bell"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                              id="userNotifBadge" style="font-size: .6rem;">0</span>
                    </a>

                    <!-- width phải là min(...): 340px cứng thì trên màn 360px dropdown tràn ra
                         ngoài viewport và kéo theo scroll ngang cho cả trang. Sửa thẳng ở inline
                         style vì inline thắng stylesheet — phủ từ file ngoài sẽ phải dùng !important. -->
                    <div class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-3"
                         style="width: min(340px, calc(100vw - 24px)); max-height: 420px; overflow-y: auto;">
                        <h6 class="fw-bold mb-2">Thông báo</h6>
                        <div id="userNotifList">
                            <div class="text-muted small py-2">Đang tải…</div>
                        </div>
                    </div>
                </div>

                <!-- Chưa đăng nhập -->
                <div sec:authorize="!isAuthenticated()">
                    <a class="text-dark fs-5" th:href="@{/login}" style="color: #00796b !important;" title="Đăng nhập">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </div>

                <!-- Đã đăng nhập: Giữ nguyên logic hiển thị Dropdown & Avatar của bạn -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fs-5" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="color: #00796b !important;">

                        <!-- Hiển thị Icon nếu không có Avatar -->
                        <i th:if="${#authentication.principal.avatar == null or #strings.isEmpty(#authentication.principal.avatar)}" class="bi bi-person-circle"></i>

                        <!-- Hiển thị Avatar (URL ngoài) -->
                        <img th:if="${#authentication.principal.avatar != null and #strings.startsWith(#authentication.principal.avatar, 'http')}"
                             th:src="${#authentication.principal.avatar}"
                             alt="Avatar" class="rounded-circle" width="32" height="32" style="object-fit: cover; border: 2px solid #00796b;">

                        <!-- Hiển thị Avatar (Local) -->
                        <img th:if="${#authentication.principal.avatar != null and !#strings.isEmpty(#authentication.principal.avatar) and !#strings.startsWith(#authentication.principal.avatar, 'http')}"
                             th:src="@{'/uploads/' + ${#authentication.principal.avatar} + '?v=' + ${#dates.createNow().time}}"
                             alt="Avatar" class="rounded-circle" width="32" height="32" style="object-fit: cover; border: 2px solid #00796b;">
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end text-small shadow border-0 mt-2" aria-labelledby="userDropdown">
                        <li class="px-3 py-2 bg-light border-bottom mb-2 rounded-top">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted small text-uppercase fw-bold">Số dư ví</span>
                                <span class="text-success fw-bold">
                                    <i class="bi bi-wallet2 me-1"></i>
                                    <span th:text="${@globalHelper.getUserBalance(#authentication)}">0 đ</span>
                                </span>
                            </div>
                        </li>
                        <li><a class="dropdown-item py-2" th:href="@{/user/profile}"><i class="bi bi-person me-2 text-primary"></i>Hồ sơ cá nhân</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/user/profile}"><i class="bi bi-clock-history me-2 text-info"></i>Lịch sử khám bệnh</a></li>

                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger fw-bold" th:href="@{/admin/dashboard}">Trang Quản trị</a>
                        </li>

                        <li sec:authorize="hasRole('DOCTOR')"><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasRole('DOCTOR')">
                            <a class="dropdown-item text-primary fw-bold" th:href="@{/doctor/dashboard}">Trang Bác sĩ</a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger py-2"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <!-- Script đi kèm markup chuông ở trên: nạp ngay trong fragment để cả 22 template
         bệnh nhân đều có chuông chạy mà không phải sửa từng file. Script tự thoát khi
         trang không render chuông (khách chưa đăng nhập). -->
    <script th:src="@{/assets/js/user-notifications.js}"></script>

    <!-- Nút hamburger ở trên chỉ được bind trong assets/js/main.js, mà 11/23 trang bệnh nhân
         không nạp tệp đó (không có vendor AOS/Swiper/GLightbox mà main.js gọi vô điều kiện).
         Đặt script chuyên trách ngay cạnh markup của nó, theo đúng khuôn của chuông ở trên:
         một tệp, 22 trang. Khối mobile-nav trong main.js đã được gỡ để không bind hai lần. -->
    <script th:src="@{/assets/js/mobile-nav.js}"></script>
</header>
</html>
