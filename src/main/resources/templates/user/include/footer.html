<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<footer th:fragment="footer" class="custom-footer">

    <style>
        /* CSS Tùy chỉnh cho Footer - Thêm !important để chống xung đột Bootstrap */
        .custom-footer {
            background-color: #e8f0fe !important; /* Đảm bảo nhận màu nền xanh nhạt */
            padding: 60px 0 30px;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
            border-top: 1px solid #d1d5db; /* Đường viền nhẹ bên trên */
        }
        .custom-footer .footer-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b7a65;
            margin-bottom: 16px;
        }
        .custom-footer p {
            color: #4b5563;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0;
        }
        .custom-footer h5 {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #1f2937;
        }

        /* Ép bỏ dấu chấm tròn (bullet) của ul/li */
        .custom-footer ul {
            list-style: none !important;
            padding-left: 0 !important;
            margin: 0;
        }
        .custom-footer ul li {
            margin-bottom: 12px;
        }

        /* Ép màu link và bỏ gạch chân */
        .custom-footer ul li a {
            color: #4b5563 !important;
            text-decoration: none !important;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .custom-footer ul li a:hover {
            color: #0b7a65 !important;
        }

        /* Phần Copyright */
        .custom-footer .footer-bottom {
            margin-top: 40px;
            padding-top: 20px;
            font-size: 0.85rem;
            color: #6b7280;
            border-top: 1px solid rgba(0, 0, 0, 0.05); /* Đường kẻ mờ phân cách */
        }
    </style>

    <div class="container">
        <div class="row gy-4">

            <div class="col-lg-4 col-md-6 pe-lg-4">
                <div class="footer-brand">HealCare</div>
                <p>Chăm sóc sức khỏe toàn diện, tận tâm và chuyên nghiệp cho mọi lứa tuổi.</p>
                <div class="footer-bottom mt-4">
                    Liên hệ Zalo: <a href="https://zalo.me/0965170604" target="_blank">0965170604</a> | Email: <a href="mailto:vuhoanganh1706@gmail.com">vuhoanganh1706@gmail.com</a>
                </div>
            </div>

            <!--/* Fragment này có mặt trên MỌI trang bệnh nhân, nên một link chết ở đây là
                   link chết nhân lên 22 lần. Bốn mục cũ đều hỏng: /privacy và /terms không
                   có controller nào map (bấm vào ra 404), còn "Patient Rights", "Hướng dẫn
                   đặt lịch", "Careers" là href="#" nên chỉ nhảy lên đầu trang — riêng
                   Careers thì trớ trêu là /careers CÓ thật. Mọi mục dưới đây đều trỏ tới
                   route có thật trong controller. */-->
            <div class="col-lg-2 col-md-6">
                <h5>Thông tin</h5>
                <ul>
                    <li><a th:href="@{/medical-process}">Quy trình khám</a></li>
                    <li><a th:href="@{/working-hours}">Giờ làm việc</a></li>
                </ul>
            </div>

            <div class="col-lg-3 col-md-6">
                <h5>Bệnh nhân</h5>
                <ul>
                    <li><a th:href="@{/appointment}">Đặt lịch khám</a></li>
                    <li><a th:href="@{/doctor-schedule}">Lịch khám bác sĩ</a></li>
                </ul>
            </div>

            <div class="col-lg-3 col-md-6">
                <h5>HealCare</h5>
                <ul>
                    <li><a th:href="@{/about}">Về chúng tôi</a></li>
                    <li><a th:href="@{/careers}">Tuyển dụng</a></li>
                </ul>
            </div>

        </div>
    </div>
</footer>

</html>
