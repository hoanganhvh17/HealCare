<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Thanh toán QR - NNL Hospital</title>

  <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/assets/css/main.css}" rel="stylesheet">
  <link th:href="@{/assets/css/responsive.css}" rel="stylesheet">

  <style>
    .qr-container {
        max-width: 500px;
        margin: 80px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
    }
    .qr-image { width: 100%; max-width: 300px; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
    .payment-info { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; }
    .spinner-border { width: 1.5rem; height: 1.5rem; border-width: 0.2em; }
  </style>
</head>

<body class="bg-light">

<div th:replace="~{user/include/header :: header-nav}"></div>

<main class="main">
  <div class="container">
    <div class="qr-container">
      <h4 class="mb-3 fw-bold text-primary">Thanh toán Lịch khám</h4>
      <p class="text-muted small">Mở ứng dụng ngân hàng và quét mã QR bên dưới để thanh toán.</p>

      <img th:src="${qrUrl}" alt="VietQR" class="qr-image mb-3">

      <div class="payment-info">
        <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
          <span class="text-muted">Mã lịch hẹn:</span>
          <span class="fw-bold" th:text="'#' + ${booking.id}">#0</span>
        </div>
        <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
          <span class="text-muted">Số tiền:</span>
          <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(booking.bookingPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
        </div>
        <div class="d-flex justify-content-between">
          <span class="text-muted">Nội dung CK:</span>
          <span class="fw-bold text-primary" th:text="${addInfo}">HEALCARE 0</span>
        </div>
      </div>

      <div id="paymentStatusBox" class="mt-4 p-3 bg-warning bg-opacity-10 rounded text-warning fw-bold d-flex align-items-center justify-content-center gap-2">
        <div class="spinner-border text-warning" role="status"></div>
        <span>Hệ thống đang chờ nhận tiền... (còn <span id="countdown">3:00</span>)</span>
      </div>

      <p class="mt-3 small text-muted">Trang này sẽ tự động chuyển hướng khi thanh toán thành công. Tuyệt đối không sửa nội dung chuyển khoản!</p>
    </div>
  </div>
</main>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function() {
      const bookingId = /*[[${booking.id}]]*/ 0;
      if (bookingId <= 0) { return; }

      const box       = document.getElementById('paymentStatusBox');
      const countdown = document.getElementById('countdown');

      // BookingCleanupTask huỷ lịch chưa thanh toán sau 3 phút, nên trang này chỉ có ý nghĩa
      // trong đúng chừng ấy thời gian. Bản cũ hỏi mãi không dừng: khách ngồi nhìn vòng quay
      // "đang chờ nhận tiền" vĩnh viễn trong khi chỗ khám đã bị trả lại từ lâu.
      const DEADLINE = Date.now() + 3 * 60 * 1000 + 10 * 1000; // +10s trễ mạng
      let timer = null;

      function stop(html, cls) {
          if (timer) { clearInterval(timer); timer = null; }
          box.className = 'mt-4 p-3 rounded fw-bold d-flex align-items-center justify-content-center gap-2 ' + cls;
          box.innerHTML = html;
      }

      function expired() {
          stop('<i class="bi bi-clock-history fs-4"></i>' +
               '<span>Phiên giữ chỗ đã hết hạn. Vui lòng đặt lịch lại.</span>' +
               '<a href="/appointment" class="btn btn-sm btn-primary ms-2">Đặt lịch lại</a>',
               'bg-secondary bg-opacity-10 text-secondary');
      }

      timer = setInterval(async () => {
          const left = DEADLINE - Date.now();
          if (left <= 0) { expired(); return; }
          const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
          if (countdown) { countdown.textContent = m + ':' + String(s).padStart(2, '0'); }

          try {
              const response = await fetch(`/api/payment/check-status?id=${bookingId}`);

              // Phiên đăng nhập hết hạn thì Spring trả về HTML trang login kèm status 200,
              // nên phải xét cả redirect lẫn content-type — nếu không thì vòng lặp cứ hỏi
              // mãi một trang đăng nhập và không bao giờ thấy 'PAID'.
              if (response.redirected || !response.ok
                      || !(response.headers.get('content-type') || '').includes('json')) {
                  stop('<i class="bi bi-exclamation-triangle-fill fs-4"></i>' +
                       '<span>Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại để xem trạng thái.</span>',
                       'bg-warning bg-opacity-10 text-warning');
                  return;
              }

              const data = await response.json();
              if (data.paymentStatus === 'PAID') {
                  stop('<i class="bi bi-check-circle-fill fs-4"></i>' +
                       '<span>Thanh toán thành công! Đang chuyển hướng...</span>',
                       'bg-success bg-opacity-10 text-success');
                  setTimeout(() => { window.location.href = '/user/profile'; }, 1500);
              } else if (data.bookingStatus === 'CANCELED') {
                  expired();
              }
          } catch (error) {
              console.error("Lỗi khi check trạng thái:", error);
          }
      }, 3000);
  });
</script>

<!-- Trang này trước đây không nạp Bootstrap JS: chuông thông báo ở header dùng dropdown
     của Bootstrap nên không có bản này thì bấm vào chuông không ra gì. Nạp ĐÚNG MỘT bản —
     hai bản làm data-api chạy toggle() hai lần và mọi dropdown như bị liệt. -->
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
