<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title th:text="${post.title} + ' - HealCare'">Chi tiết tin tức</title>
  <link th:href="@{/assets/img/favicon.png}" rel="icon">
  <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/assets/css/main.css}" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
    }
    .news-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
    .news-header { margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
    .meta-item { margin-right: 20px; color: #64748b; font-size: 0.95rem; font-weight: 500;}
    .news-article {
      background: white;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 4rem;
    }
    .news-title-text {
      color: #1e293b;
      font-weight: 700;
      line-height: 1.4;
    }
    .news-content {
      color: #334155;
      line-height: 1.8;
      font-size: 1.05rem;
    }
    /* Đảm bảo nội dung sinh từ CKEditor không bị tràn */
    .news-content * {
      max-width: 100%;
    }
  </style>
</head>

<body>

<div th:replace="~{user/include/header :: header-nav}"></div>

<main class="main">

  <div class="page-title" style="padding: 120px 0 30px 0;">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Trang chủ</a></li>
          <li class="breadcrumb-item"><a th:href="@{/news}" class="text-decoration-none text-muted">Tin tức</a></li>
          <li class="breadcrumb-item active" aria-current="page" th:text="${post.title}" style="color: #0d7b6a; font-weight: 500;"></li>
        </ol>
      </nav>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">

          <article class="news-article">
            <div class="news-header">
              <span class="badge bg-light text-success border border-success mb-3" style="font-size: 0.85rem;" th:text="${post.category == 'NEWS' ? 'TIN TỨC' : (post.category == 'KNOWLEDGE' ? 'Y HỌC THƯỜNG THỨC' : 'TIN Y TẾ')}">Danh mục</span>

              <h1 class="mb-4 news-title-text" th:text="${post.title}">Tiêu đề bài viết</h1>

              <div class="d-flex align-items-center">
                <span class="meta-item"><i class="bi bi-calendar3 me-1 text-success"></i> <span th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
                <span class="meta-item"><i class="bi bi-person me-1 text-success"></i> <span th:text="${post.author != null ? post.author.fullName : 'Ban biên tập HealCare'}"></span></span>
              </div>
            </div>

            <p class="lead fw-medium mb-4" style="color: #475569;" th:if="${post.summary != null}" th:text="${post.summary}"></p>

            <div class="mb-5 text-center" th:if="${post.image != null}">
              <img th:src="@{'/uploads/' + ${post.image}}" class="img-fluid rounded" alt="Cover Image" style="max-height: 600px; object-fit: contain;">
            </div>

            <div class="news-content" th:utext="${post.content}">
              <p>Nội dung đang cập nhật...</p>
            </div>

            <!-- Dẫn nguồn cho bài do hệ thống thu thập từ báo chính thống.
                 Để Ở ĐÂY chứ không nhét vào post.content: nguồn là dữ liệu có cấu trúc, admin sửa
                 nội dung bài thoải mái mà không lỡ tay xoá mất phần ghi nguồn. -->
            <div class="alert alert-light border-start border-4 border-success mt-4 mb-0"
                 th:if="${post.sourceUrl != null and !post.sourceUrl.isEmpty()}">
              <i class="bi bi-link-45deg me-1 text-success"></i>
              <strong>Nguồn:</strong>
              <span th:text="${post.sourceName}">Tên báo</span>
              &mdash;
              <a th:href="${post.sourceUrl}" target="_blank" rel="noopener nofollow">Đọc bản gốc</a>
              <div class="small text-muted mt-1">
                NNL Hospital tóm tắt lại từ bài gốc. Vui lòng xem bản gốc để có đầy đủ thông tin.
              </div>
            </div>

            <div class="mt-5 pt-4 border-top text-center">
              <a th:href="@{/news}" class="btn" style="background-color: #f1f5f9; color: #0d7b6a; font-weight: 500; border-radius: 8px; padding: 10px 20px;">
                <i class="bi bi-arrow-left me-1"></i> Trở về trang tin tức
              </a>
            </div>
          </article>

        </div>
      </div>
    </div>
  </section>

</main>

<div th:replace="~{user/include/footer :: footer}"></div>
<div th:replace="~{user/include/ai-chat :: chat-widget}"></div>
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
