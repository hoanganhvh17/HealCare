<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>403 - Không có quyền truy cập</title>
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/css/main.css}" rel="stylesheet">
    <style>
        body { background: #f6f9ff; color: #444444; font-family: "Open Sans", sans-serif; }
        .error-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-code { font-size: 8rem; font-weight: 700; color: #dc3545; line-height: 1; margin-bottom: 20px; }
        .error-message { font-size: 1.5rem; margin-bottom: 30px; color: #012970; }
        .btn-back { background: #4154f1; border: 0; padding: 10px 30px; color: #fff; transition: 0.4s; border-radius: 4px; text-decoration: none; }
        .btn-back:hover { background: #5969f3; color: #fff; }
    </style>
</head>

<body>

<div class="container">
    <section class="error-container">
        <h1 class="error-code">403</h1>
        <h2 class="error-message">Bạn không có quyền truy cập trang này.</h2>
        <p class="text-muted mb-4">Xin lỗi, trang này chỉ dành cho Quản trị viên hoặc Bác sĩ được cấp quyền.</p>
        <a class="btn-back" th:href="@{/}">Quay về Trang chủ</a>
        <div class="mt-4">
            <img th:src="@{/assets/img/not-found.svg}" class="img-fluid py-5" alt="" style="max-height: 300px;">
        </div>
    </section>
</div>

</body>
</html>
