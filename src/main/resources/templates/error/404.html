<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!--/* Trang này trước đây là 283 dòng bê nguyên từ theme BootstrapMade và hỏng ba đường
       cùng lúc:
       1. Toàn bộ <link> tài nguyên dùng đường dẫn TƯƠNG ĐỐI ("assets/css/main.css", không
          có th:href). Lỗi 404 xảy ra ở URL sâu — ví dụ /admin/xyz — thì trình duyệt đi tìm
          /admin/assets/css/main.css và trang lỗi hiện ra KHÔNG CÓ CSS, vỡ hoàn toàn.
       2. Logo và nút "Về trang chủ" đều là href="index.html", tức bấm vào lại ra 404 lần
          nữa. Người dùng vào đây là kẹt, không có đường ra.
       3. Menu đầy đủ của theme trỏ tới about.html / doctors.html / faq.html / gallery.html
          / testimonials.html / terms.html / privacy.html — năm trang cuối KHÔNG TỒN TẠI
          trong dự án, còn lại đều là link chết.
       Viết lại theo đúng khuôn error/403.html và error/500.html: tự chứa, th:href, không
       phụ thuộc fragment nào (trang lỗi phải render được cả khi phần khác đang hỏng). */-->

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>404 - Không tìm thấy trang</title>
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/css/main.css}" rel="stylesheet">
    <link th:href="@{/assets/css/responsive.css}" rel="stylesheet">
    <style>
        body { background: #f6f9ff; color: #444444; font-family: "Open Sans", sans-serif; }
        .error-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-code { font-size: 8rem; font-weight: 700; color: #0d9488; line-height: 1; margin-bottom: 20px; }
        .error-message { font-size: 1.5rem; margin-bottom: 30px; color: #012970; }
        .btn-back { background: #0d9488; border: 0; padding: 10px 30px; color: #fff; transition: 0.4s; border-radius: 4px; text-decoration: none; }
        .btn-back:hover { background: #0f766e; color: #fff; }
        .helpful-links a { color: #0d9488; text-decoration: none; }
        .helpful-links a:hover { text-decoration: underline; }
    </style>
</head>

<body>

<div class="container">
    <section class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Không tìm thấy trang bạn yêu cầu.</h2>
        <p class="text-muted mb-4">
            Đường dẫn có thể đã thay đổi hoặc không còn tồn tại.
        </p>

        <div class="d-flex gap-3 flex-wrap justify-content-center">
            <a class="btn-back" th:href="@{/}">Về Trang chủ</a>
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Quay lại</a>
        </div>

        <!--/* Chỉ liệt kê những route CÓ THẬT trong controller — đây chính là chỗ bản cũ sai:
               nó mời người dùng đi tiếp vào năm trang không tồn tại. */-->
        <div class="helpful-links mt-5">
            <p class="text-muted mb-2">Hoặc bạn có thể tới:</p>
            <a th:href="@{/doctors}">Đội ngũ bác sĩ</a>
            <span class="text-muted mx-2">·</span>
            <a th:href="@{/departments}">Chuyên khoa</a>
            <span class="text-muted mx-2">·</span>
            <a th:href="@{/appointment}">Đặt lịch khám</a>
            <span class="text-muted mx-2">·</span>
            <a th:href="@{/contact}">Liên hệ</a>
        </div>
    </section>
</div>

</body>
</html>
