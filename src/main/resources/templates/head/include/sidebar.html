<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside id="sidebar" class="sidebar" th:fragment="sidebar">
    <ul class="sidebar-nav" id="sidebar-nav">

        <li class="nav-heading">Trưởng khoa</li>

        <li class="nav-item">
            <a class="nav-link" th:classappend="${activePage != 'dashboard'} ? 'collapsed' : ''"
               th:href="@{/head/dashboard}">
                <i class="bi bi-grid"></i>
                <span>Tổng quan khoa</span>
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:classappend="${activePage != 'leave-requests'} ? 'collapsed' : ''"
               th:href="@{/head/leave-requests}">
                <i class="bi bi-inbox"></i>
                <span>Duyệt đơn nghỉ</span>
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:classappend="${activePage != 'clinic-roster'} ? 'collapsed' : ''"
               th:href="@{/head/clinic-roster}">
                <i class="bi bi-calendar2-week"></i>
                <span>Xếp ca khoa</span>
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:classappend="${activePage != 'duty-roster'} ? 'collapsed' : ''"
               th:href="@{/head/duty-roster}">
                <i class="bi bi-clipboard-check"></i>
                <span>Lịch trực của khoa</span>
            </a>
        </li>

        <li class="nav-heading">Cá nhân</li>

        <li class="nav-item">
            <a class="nav-link collapsed" th:href="@{/doctor/work-schedule}">
                <i class="bi bi-calendar-week"></i>
                <span>Lịch làm việc của tôi</span>
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link collapsed" th:href="@{/doctor/dashboard}">
                <i class="bi bi-speedometer2"></i>
                <span>Trang bác sĩ</span>
            </a>
        </li>

        <li class="nav-item">
            <!--/* Form POST chứ không phải <a>: khi bật CSRF, LogoutFilter chỉ còn khớp POST /logout
                   nên mọi thẻ <a> sẽ IM LẶNG ngừng đăng xuất — không lỗi, không log. Khuôn lấy
                   nguyên từ user/include/header.html, chỗ duy nhất xưa nay vẫn làm đúng. */-->
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="nav-link collapsed"
                        style="background:none;border:0;width:100%;text-align:left;">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </li>
    </ul>
</aside>
</body>
</html>
